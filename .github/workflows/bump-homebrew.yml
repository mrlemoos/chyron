name: Bump Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to bump the formula to (e.g. v0.1.0)
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      TAP: mrlemoos/homebrew-chyron
      GH_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
    steps:
      - name: Bump formula in tap
        run: |
          url="https://github.com/mrlemoos/chyron/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap
          cd tap
          f=Formula/chyron.rb
          sed -i -E "s#^  url \".*\"#  url \"${url}\"#" "$f"
          sed -i -E "s#^  sha256 \".*\"#  sha256 \"${sha}\"#" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "formula already at ${TAG}, nothing to do"; exit 0; fi
          git commit -aqm "chyron ${TAG#v}"
          git push -q
