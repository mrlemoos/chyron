name: Bump Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to bump the formula to (e.g. v0.1.0)
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: chyron
          homebrew-tap: mrlemoos/homebrew-chyron
          base-branch: main
          tag-name: ${{ env.TAG }}
          download-url: https://github.com/mrlemoos/chyron/archive/refs/tags/${{ env.TAG }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
